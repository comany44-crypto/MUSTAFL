{% extends 'layout.html' %}{% block content %}<div class="title-row"><div><h1>{{'تعديل المنتج' if p else 'إضافة منتج جديد'}}</h1><p class="muted">الحقول العربية والإنجليزية تظهر في موقعك حسب اللغة المختارة.</p></div><a href="{{url_for('products_admin')}}">العودة للمنتجات</a></div><form class="product-form" method="post" enctype="multipart/form-data"><div class="grid2"><label>اسم المنتج بالعربي*<input name="name_ar" value="{{p.name_ar if p else ''}}" required></label><label>Product name in English<input name="name_en" value="{{p.name_en if p else ''}}"></label><label>القسم*<select name="category">{% for x in ['مضخات','مضخات الحريق','ماطورات كهربائية','غطاسات','مضخات نفط وزفت ودهن','مضخات لطش','مضخات Jockey','ورشة متخصصة','تجارة عامة'] %}<option {{'selected' if p and p.category==x else ''}}>{{x}}</option>{% endfor %}</select></label><label>الموديل<input name="model" value="{{p.model if p else ''}}"></label></div><label>الوصف بالعربي<textarea name="description_ar">{{p.description_ar if p else ''}}</textarea></label><label>Description in English<textarea name="description_en">{{p.description_en if p else ''}}</textarea></label><div class="grid2"><label>صورة المنتج<input type="file" name="image" accept="image/png,image/jpeg,image/webp">{% if p and p.image %}<img class="preview" src="{{url_for('static',filename='uploads/'+p.image)}}">{% endif %}</label><label>الحالة<select name="status"><option value="published" {{'selected' if p and p.status=='published' else ''}}>منشور</option><option value="draft" {{'selected' if p and p.status=='draft' else ''}}>مسودة</option></select></label></div><button class="btn big">{{'حفظ التعديلات' if p else 'نشر المنتج'}}</button></form>{% endblock %}
